<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discount Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; }
    input, button { font: inherit; padding: .4rem .6rem; }
    output { display: block; margin-top: 1rem; font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>Discount Calculator</h1>
  <form id="calc">
    <label for="price">Price</label>
    <input id="price" type="number" step="0.01" value="50" required>
    <label for="percent">Discount %</label>
    <input id="percent" type="number" step="1" value="10" required>
    <p><button type="submit">Apply</button></p>
  </form>
  <output id="result"></output>
  <script type="module">
    import { applyDiscount } from './price.js';
    const form = document.getElementById('calc');
    const result = document.getElementById('result');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const price = Number(document.getElementById('price').value);
      const percent = Number(document.getElementById('percent').value);
      try {
        result.textContent = applyDiscount(price, percent).toFixed(2);
      } catch (err) {
        result.textContent = err.message;
      }
    });
  </script>
</body>
</html>
